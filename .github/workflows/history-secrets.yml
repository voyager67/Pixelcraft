name: Pixelcraft history secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail

          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl --fail --silent --show-error --location \
            "${release_url}/${archive}" \
            --output "$RUNNER_TEMP/${archive}"
          curl --fail --silent --show-error --location \
            "${release_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --output "$RUNNER_TEMP/checksums.txt"

          awk -v file="${archive}" '$2 == file { print; found = 1 } END { if (!found) exit 1 }' \
            "$RUNNER_TEMP/checksums.txt" > "$RUNNER_TEMP/checksum.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check checksum.txt)

          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: Scan commit history across all refs
        run: gitleaks git --redact --log-opts="--all" .
