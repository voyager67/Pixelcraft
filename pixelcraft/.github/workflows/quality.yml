name: Pixelcraft checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate skill metadata and structure
        run: python3 scripts/validate_skills.py
      - name: Scan for obvious secrets and sensitive files
        run: python3 scripts/security_audit.py
