<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="410" viewBox="0 0 1440 410" role="img" aria-labelledby="title desc">
<title id="title">The Pixelcraft workflow</title><desc id="desc">Five evidence-first steps: inspect, detect, prioritize, repair and verify.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#171D32"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9A85FF"/><stop offset="1" stop-color="#56D9D0"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#A7B0D0" stroke-opacity=".055" fill="none"/></pattern>
</defs>
<rect width="1440" height="410" rx="28" fill="url(#bg)"/><rect width="1440" height="410" rx="28" fill="url(#grid)"/>
<text x="72" y="78" fill="#F6F7FF" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800">A practical workflow. Not random polish.</text>
<text x="72" y="111" fill="#AAB3CF" font-family="Inter,Arial,sans-serif" font-size="16">Each pass has a purpose and a clear handoff to the next.</text>
<path d="M182 214H1260" stroke="#586382" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 10"/>
<path d="M182 214H1260" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity=".8"/>
<g font-family="Inter,Arial,sans-serif">
 <g transform="translate(72 160)"><rect width="220" height="174" rx="18" fill="#1A2238" stroke="#647093" stroke-opacity=".6"/><circle cx="38" cy="54" r="23" fill="#8D7BFF" fill-opacity=".2" stroke="#A899FF"/><text x="38" y="61" text-anchor="middle" fill="#D5CFFF" font-size="18" font-weight="800">01</text><text x="22" y="111" fill="#F5F6FF" font-size="21" font-weight="700">Inspect</text><text x="22" y="139" fill="#AAB3CF" font-size="13">Rendered UI, code,</text><text x="22" y="157" fill="#AAB3CF" font-size="13">content and constraints.</text></g>
 <g transform="translate(352 160)"><rect width="220" height="174" rx="18" fill="#1A2238" stroke="#647093" stroke-opacity=".6"/><circle cx="38" cy="54" r="23" fill="#8D7BFF" fill-opacity=".2" stroke="#A899FF"/><text x="38" y="61" text-anchor="middle" fill="#D5CFFF" font-size="18" font-weight="800">02</text><text x="22" y="111" fill="#F5F6FF" font-size="21" font-weight="700">Detect</text><text x="22" y="139" fill="#AAB3CF" font-size="13">Observable patterns,</text><text x="22" y="157" fill="#AAB3CF" font-size="13">evidence and impact.</text></g>
 <g transform="translate(632 160)"><rect width="220" height="174" rx="18" fill="#1A2238" stroke="#647093" stroke-opacity=".6"/><circle cx="38" cy="54" r="23" fill="#8D7BFF" fill-opacity=".2" stroke="#A899FF"/><text x="38" y="61" text-anchor="middle" fill="#D5CFFF" font-size="18" font-weight="800">03</text><text x="22" y="111" fill="#F5F6FF" font-size="21" font-weight="700">Prioritize</text><text x="22" y="139" fill="#AAB3CF" font-size="13">Root causes before</text><text x="22" y="157" fill="#AAB3CF" font-size="13">low-impact cosmetics.</text></g>
 <g transform="translate(912 160)"><rect width="220" height="174" rx="18" fill="#1A2238" stroke="#647093" stroke-opacity=".6"/><circle cx="38" cy="54" r="23" fill="#65D5C5" fill-opacity=".17" stroke="#65D5C5"/><text x="38" y="61" text-anchor="middle" fill="#B8F1E7" font-size="18" font-weight="800">04</text><text x="22" y="111" fill="#F5F6FF" font-size="21" font-weight="700">Repair</text><text x="22" y="139" fill="#AAB3CF" font-size="13">Make targeted changes;</text><text x="22" y="157" fill="#AAB3CF" font-size="13">preserve product behavior.</text></g>
 <g transform="translate(1192 160)"><rect width="176" height="174" rx="18" fill="#1A2238" stroke="#647093" stroke-opacity=".6"/><circle cx="38" cy="54" r="23" fill="#65D5C5" fill-opacity=".17" stroke="#65D5C5"/><text x="38" y="61" text-anchor="middle" fill="#B8F1E7" font-size="18" font-weight="800">05</text><text x="22" y="111" fill="#F5F6FF" font-size="21" font-weight="700">Verify</text><text x="22" y="139" fill="#AAB3CF" font-size="13">Responsive, accessible</text><text x="22" y="157" fill="#AAB3CF" font-size="13">and working as intended.</text></g>
</g>
<text x="72" y="376" fill="#7884A7" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.2">EVIDENCE FIRST  ·  PRODUCT CONTEXT  ·  HUMAN REVIEW</text>
</svg>