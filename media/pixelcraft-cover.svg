<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Pixelcraft — Make AI-assisted interfaces feel intentional</title>
  <desc id="desc">A dark, violet-accented product illustration showing a design audit beside a refined interface. Pixelcraft is a 51-skill design-quality library.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B15"/><stop offset="1" stop-color="#13172B"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C6CFF" stop-opacity=".32"/><stop offset="1" stop-color="#41D9CC" stop-opacity=".06"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9A85FF"/><stop offset="1" stop-color="#56D9D0"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#20263B"/><stop offset="1" stop-color="#141A2B"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="16"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9AA5C9" stroke-opacity=".07" stroke-width="1"/></pattern>
  </defs>
  <rect width="1440" height="760" rx="32" fill="url(#bg)"/>
  <rect width="1440" height="760" rx="32" fill="url(#grid)"/>
  <circle cx="1100" cy="340" r="390" fill="url(#glow)"/>
  <path d="M0 610 C260 520 420 710 690 630 S1120 490 1440 590 V760 H0Z" fill="#11172A" opacity=".58"/>
  <g transform="translate(86 70)">
    <rect width="44" height="44" rx="13" fill="url(#accent)"/>
    <path d="M12 29V15l10 8 10-8v14" stroke="#0C1020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="62" y="31" fill="#F7F8FF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="2">PIXELCRAFT</text>
    <text x="1260" y="28" text-anchor="end" fill="#A8B0CD" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="2">DESIGN QUALITY TOOLKIT</text>
  </g>
  <g transform="translate(88 232)">
    <rect width="244" height="40" rx="20" fill="#8C7BFF" fill-opacity=".14" stroke="#9C8EFF" stroke-opacity=".45"/>
    <circle cx="21" cy="20" r="5" fill="#A99BFF"/>
    <text x="40" y="26" fill="#D7D1FF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">51 SPECIALIST SKILLS</text>
    <text x="0" y="130" fill="#F7F8FF" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2">Less generic UI.</text>
    <text x="0" y="210" fill="#F7F8FF" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2">More intentional</text>
    <text x="0" y="290" fill="#F7F8FF" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2">products.</text>
    <rect x="0" y="326" width="82" height="5" rx="3" fill="url(#accent)"/>
    <text x="0" y="382" fill="#B7BED4" font-family="Inter,Arial,sans-serif" font-size="22">An evidence-first skill library for auditing,</text>
    <text x="0" y="416" fill="#B7BED4" font-family="Inter,Arial,sans-serif" font-size="22">repairing and verifying AI-assisted interfaces.</text>
    <g transform="translate(0 476)">
      <rect width="156" height="42" rx="11" fill="#ECEBFF"/>
      <text x="78" y="27" text-anchor="middle" fill="#18152E" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">EXPLORE SKILLS ↗</text>
      <text x="180" y="27" fill="#A8B0CD" font-family="Inter,Arial,sans-serif" font-size="15">ChatGPT · Codex · compatible agents</text>
    </g>
  </g>
  <g transform="translate(760 170)" filter="url(#shadow)">
